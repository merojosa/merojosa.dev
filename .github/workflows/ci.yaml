name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']

# Concurrency group name ensures concurrent workflow runs wait for any in-progress job to finish
concurrency:
  group: merge-${{ github.ref }}

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v7
      - name: 'pnpm setup'
        uses: pnpm/action-setup@v6
        with:
          # pnpm 11+ is required: pnpm-workspace.yaml uses the `allowBuilds` field,
          # which pnpm 10 ignores (leaving sharp/puppeteer build scripts unapproved).
          version: 11
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Install Chrome for Puppeteer
        run: pnpx puppeteer browsers install chrome
      - name: Generate PDF resume
        run: pnpm generate-resume-pdf
      - name: Build site
        run: pnpm build
      - name: Copy PDF to build output
        run: cp public/resume.pdf dist/client/resume.pdf
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE_ARN_GITHUB }}
          role-duration-seconds: 1000
          aws-region: us-east-1
      - name: Deploy to AWS
        run: pnpm sst deploy --stage production
